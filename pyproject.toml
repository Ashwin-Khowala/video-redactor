[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-redactor"
version = "0.1.0"
description = "Automatically blur sensitive info (emails, phone numbers) in videos using OCR"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Ashwin Khowala" }
]
keywords = ["video", "ocr", "privacy", "redaction", "blur"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.0.0",
    "easyocr>=1.7.0",
    "opencv-python-headless>=4.8.0",
]
gpu = [
    "torch>=2.0.0",
    "easyocr>=1.7.0",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
video-redactor = "video_redactor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_redactor"]

[tool.mypy]
ignore_missing_imports = true

